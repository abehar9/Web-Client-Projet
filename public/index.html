<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bomberman</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import de Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <header>
        <ul>
            <li><a href="menu.html">Menu</a></li>
            <li>temps : 2:00</li>
            <li>score : 0</li>
        </ul>
    </header>
    <main>
        <!-- Le jeu Phaser s'insérera ici -->
        <div id="game-container"></div>
    </main>

    <script>
        const socket = io();

        // Définition de la scène de jeu
        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
                this.tileSize = 45; // Ajusté pour s'intégrer harmonieusement dans la page
            }

            create() {
                // Écoute de la grille envoyée par ton serveur Node.js
                socket.on('initGrid', (grid) => {
                    this.drawGrid(grid);
                });
            }

            drawGrid(grid) {
                for (let y = 0; y < grid.length; y++) {
                    for (let x = 0; x < grid[y].length; x++) {
                        const cell = grid[y][x];
                        
                        // Couleurs basées sur les variables CSS de ton style.css
                        // Sol : #abcfc7 | Mur cassable : #a183b9 | Mur incassable : #7a7fa7
                        let color = 0xabcfc7; 

                        if (cell === 1) color = 0x7a7fa7;      // Mur incassable
                        else if (cell === 2) color = 0xa183b9; // Mur cassable

                        const rect = this.add.rectangle(
                            x * this.tileSize + this.tileSize / 2, 
                            y * this.tileSize + this.tileSize / 2, 
                            this.tileSize - 2, // Petit espace simulant le gap du CSS
                            this.tileSize - 2, 
                            color
                        );
                    }
                }
            }
        }

        // Configuration globale du jeu Phaser adaptée à une grille de 13x13 (ou 17x13)
        const config = {
            type: Phaser.AUTO,
            width: 13 * 45,  // Largeur totale calculée dynamiquement
            height: 13 * 45, // Hauteur totale
            parent: 'game-container',
            backgroundColor: '#7a7fa7', // Correspond à --grille-background-color
            scene: GameScene
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
