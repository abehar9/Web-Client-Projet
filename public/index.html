<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bomberman</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import de Phaser et Socket.io -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <header>
        <ul>
            <li><a href="menu.html">Menu</a></li>
            <li>temps : 2:00</li>
            <li>score : 0</li>
        </ul>
    </header>
    <main>
        <!-- Conteneur d'affichage du canvas Phaser -->
        <div id="game-container"></div>
    </main>

    <script>
        const socket = io();

        // Définition de la scène principale du jeu
        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
                this.tileSize = 45;
                this.playerSprites = {}; 
            }

            preload() {
                // Chargement des ressources graphiques du personnage
                this.load.image('flora_back', '/Sprite_Characters/Flora/FloraBackStatic.png');
                this.load.image('flora_front', '/Sprite_Characters/Flora/FloraFrontStatic.png');
                this.load.image('flora_left', '/Sprite_Characters/Flora/FloraLeftStatic.png');
                this.load.image('flora_right', '/Sprite_Characters/Flora/FloraRightStatic.png');
                
            }

            create() {
                this.cursors = this.input.keyboard.createCursorKeys();
                this.moveTimer = 0;

                // Écoute de la grille initiale envoyée par le serveur
                socket.on('initGrid', (grid) => {
                    this.drawGrid(grid);
                });

                // Réception de la liste des joueurs déjà présents
                socket.on('currentPlayers', (serverPlayers) => {
                    for (let id in serverPlayers) {
                        this.createOrUpdatePlayer(serverPlayers[id]);
                    }
                });

                // Arrivée d'un nouveau joueur en cours de partie
                socket.on('newPlayer', (player) => {
                    this.createOrUpdatePlayer(player);
                });

                // Mise à jour de la position d'un joueur en mouvement
                socket.on('updatePlayerPosition', (player) => {
                    this.createOrUpdatePlayer(player);
                });

                // Suppression du sprite d'un joueur déconnecté
                socket.on('removePlayer', (id) => {
                    if (this.playerSprites[id]) {
                        this.playerSprites[id].destroy();
                        delete this.playerSprites[id];
                    }
                });

                // Demande des données de jeu une fois que les écouteurs sont prêts
                socket.emit('requestGameData');
            }

            drawGrid(grid) {
                for (let y = 0; y < grid.length; y++) {
                    for (let x = 0; x < grid[y].length; x++) {
                        const cell = grid[y][x];
                        let color = 0xabcfc7; // Sol par défaut

                        if (cell === 1) color = 0x7a7fa7;      // Mur incassable
                        else if (cell === 2) color = 0xa183b9; // Mur cassable

                        const rect = this.add.rectangle(
                            x * this.tileSize + this.tileSize / 2, 
                            y * this.tileSize + this.tileSize / 2, 
                            this.tileSize, 
                            this.tileSize, 
                            color
                        );
                        rect.setStrokeStyle(1, 0x5a5f87);
                    }
                }
            }

            addPlayer(playerInfo, isLocal) {
                const x = playerInfo.x * this.tileSize + this.tileSize / 2;
                const y = playerInfo.y * this.tileSize + this.tileSize / 2;

                // Use sprite instead of shape, defaulting to front view
                const playerSprite = this.add.sprite(x, y, 'flora_front');
                playerSprite.setDisplaySize(this.tileSize - 5, this.tileSize - 5);

                if (isLocal) {
                    this.localPlayer = { 
                        sprite: playerSprite, 
                        gridX: playerInfo.x, 
                        gridY: playerInfo.y 
                    };
                } else {
                    this.otherPlayers[playerInfo.id] = { sprite: playerSprite };
                }
            }


            update(time) {
                // Gestion des contrôles clavier avec limitation de fréquence
                if (time > this.moveTimer) {
                    let direction = null;

                    if (this.cursors.left.isDown) direction = 'left';
                    else if (this.cursors.right.isDown) direction = 'right';
                    else if (this.cursors.up.isDown) direction = 'up';
                    else if (this.cursors.down.isDown) direction = 'down';

                    if (direction) {
                        socket.emit('playerMove', direction);
                        this.moveTimer = time + 150;
                    }
                }
            }

            createOrUpdatePlayer(player) {
                const targetX = player.x * this.tileSize + this.tileSize / 2;
                const targetY = player.y * this.tileSize + this.tileSize / 2;
                const isLocal = (player.id === socket.id);

                if (this.playerSprites[player.id]) {
                    // Update position if sprite already exists
                    const sprite = this.playerSprites[player.id];
                    sprite.x = targetX;
                    sprite.y = targetY;

                    // Update direction texture if provided by server
                    if (player.direction) {
                        this.updatePlayerDirection(sprite, player.direction);
                    }

                } else {
                    // Create new sprite (using correct key 'flora_front')
                    const pSprite = this.add.sprite(targetX, targetY, 'flora_front');
                    pSprite.setDisplaySize(this.tileSize - 10, this.tileSize - 10);
                    pSprite.setDepth(10); // Ensure player renders above the grid

                    if (isLocal) {
                        this.localPlayer = pSprite;
                    }

                    this.playerSprites[player.id] = pSprite;
                }
            }

            // Direction helper method
            updatePlayerDirection(sprite, direction) {
                console.log("Changing direction to:", direction);
                if (direction === 'up') sprite.setTexture('flora_back');
                else if (direction === 'down') sprite.setTexture('flora_front');
                else if (direction === 'left') sprite.setTexture('flora_left');
                else if (direction === 'right') sprite.setTexture('flora_right');
            }
        }

        // Configuration globale de l'instance Phaser
        const config = {
            type: Phaser.AUTO,
            width: 13 * 45,
            height: 13 * 45,
            parent: 'game-container',
            backgroundColor: '#7a7fa7',
            scene: GameScene
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
